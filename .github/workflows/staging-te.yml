# Staging CD for the Teaching Engine. See deploy/staging/README.md.
#
#   push to staging (a merge)  -> deploy that commit to the staging server
#   "Run workflow" button      -> the same, for the staging branch's current commit
#
# No test job here: the image build on the server (next build, with its type check) is the
# gate, and a failed build leaves the running container untouched. The full suite runs in
# ci.yml.
# GitHub holds only the CI SSH key (secret) and the server's address and host key
# (variables). The app's own secrets stay on the server in /srv/kafuo/env.
name: Staging Teaching Engine

on:
  push:
    branches: [staging]
  workflow_dispatch:

# One run at a time, and never cancel one halfway.
concurrency:
  group: staging-te
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to staging
    if: github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: https://kafuo-staging.tailcd4398.ts.net:8443/api/health
    steps:
      # Out-of-order guard: runs queue one at a time, but a re-run of an older run (or an
      # older queued run) would still deploy older code over newer code. Deploy only while
      # this commit is still the staging tip; otherwise skip (the newer run deploys it).
      # A failed read fails the job: never deploy without knowing the tip.
      - name: Check that ${{ github.sha }} is still the staging tip
        id: tip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tip="$(gh api "repos/$REPO/git/ref/heads/staging" --jq .object.sha)"
          if [ -z "$tip" ]; then
            echo "::error::Could not read the origin/staging tip; refusing to deploy."
            exit 1
          fi
          if [ "$tip" = "$SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
            echo "Deploying $SHA: it is the current origin/staging tip."
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::$SHA is no longer the origin/staging tip ($tip). Skipping so older code never replaces newer code; the run for $tip deploys it."
          fi

      # StrictHostKeyChecking with the pinned key: the job talks only to our server.
      - name: Load the SSH key and the server's host key
        if: steps.tip.outputs.current == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.STAGING_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging_ci
          chmod 600 ~/.ssh/staging_ci
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      # The server runs only `deploy <SHA>` for this key (authorized_keys forced command
      # /srv/kafuo/bin/ci-deploy-app te), and only for a commit that is on origin/staging.
      - name: Deploy ${{ github.sha }}
        if: steps.tip.outputs.current == 'true'
        env:
          HOST: ${{ vars.STAGING_HOST }}
          USER_NAME: ${{ vars.STAGING_USER }}
          SHA: ${{ github.sha }}
        run: |
          ssh -i ~/.ssh/staging_ci \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$USER_NAME@$HOST" "deploy $SHA"

      - name: Remove the SSH key
        if: always()
        run: rm -f ~/.ssh/staging_ci
